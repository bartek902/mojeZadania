{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Katalog Książek</title>
    <!-- Zewnętrzny plik CSS zgodnie z wymogami Django -->
    <link rel="stylesheet" href="{% static 'katalog/style.css' %}">
</head>
<body>
    <h1>Moja Kolekcja Książek</h1>
    <p>Aplikacja demonstracyjna - API Django i JavaScript fetch()</p>
    
    <div class="controls">
        <label>
            <input type="checkbox" id="available-filter"> 
            Pokaż tylko dostępne książki
        </label>
        <br><br>
        <button id="load-btn">Wczytaj dane</button>
    </div>
    
    <!-- Miejsca na komunikaty i wyniki z API -->
    <div id="status-container" class="status-msg"></div>
    <div id="results-area"></div>

    <script>
        const btn = document.getElementById('load-btn');
        const filter = document.getElementById('available-filter');
        const statusContainer = document.getElementById('status-container');
        const resultsArea = document.getElementById('results-area');

        btn.addEventListener('click', () => {
            // 1. Budowanie adresu URL z parametrem filtra
            let url = '/api/obiekty/';
            if (filter.checked) {
                url += '?available=true';
            }

            // 2. Obsługa ładowania
            statusContainer.textContent = 'Pobieranie danych z serwera...';
            statusContainer.className = 'status-msg';
            resultsArea.innerHTML = ''; // czyszczenie poprzednich wyników

            // 3. Wysłanie żądania HTTP GET
            fetch(url)
                .then(response => {
                    // Sprawdzanie poprawności odpowiedzi
                    if (!response.ok) {
                        throw new Error(`Błąd HTTP: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    statusContainer.textContent = ''; // Usunięcie komunikatu o ładowaniu
                    
                    const items = data.items;
                    
                    // Obsługa pustej listy
                    if (items.length === 0) {
                        statusContainer.textContent = 'Brak rekordów spełniających kryteria.';
                        return;
                    }

                    // 4. Bezpieczna aktualizacja DOM dla każdego obiektu
                    items.forEach(book => {
                        const card = document.createElement('div');
                        card.className = 'book-card';
                        
                        const title = document.createElement('h3');
                        title.textContent = `${book.title} (${book.published_year})`;
                        
                        const author = document.createElement('p');
                        author.textContent = `Autor: ${book.author}`;
                        
                        const availability = document.createElement('p');
                        availability.textContent = book.is_available ? '✔ Dostępna' : '✘ Wypożyczona';
                        availability.className = book.is_available ? 'badge-true' : 'badge-false';
                        
                        // Złożenie karty i wstawienie na stronę
                        card.appendChild(title);
                        card.appendChild(author);
                        card.appendChild(availability);
                        resultsArea.appendChild(card);
                    });
                })
                .catch(error => {
                    // Obsługa błędów sieci/serwera
                    statusContainer.textContent = 'Wystąpił błąd podczas pobierania danych.';
                    statusContainer.className = 'status-msg error-msg';
                    console.error('Fetch error:', error);
                });
        });
    </script>
</body>
</html>
